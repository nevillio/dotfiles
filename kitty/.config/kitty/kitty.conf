# vim:ft=kitty
# BEGIN_KITTY_THEME
# Catppuccin-Mocha
include ./themes/catppuccin-mocha.conf
# END_KITTY_THEME

font_size 15.0
background_opacity 0.9

disable_ligatures never

window_padding_width 0.0

hide_window_decorations yes
window_border_width 1.5pt
draw_minimal_borders yes

# Tabs
tab_bar_margin_height 0.0 0.0
tab_bar_margin_width 0.0
tab_bar_style hidden

#interactively select tab
map ctrl+` select_tab
# move tab into a new window
map ctrl+f2 detach_tab


# enable cursor trail
cursor_shape beam
cursor_trail 1

# Session keybindings and settings
focus_follows_mouse yes
active_border_color #4d6b4a
inactive_border_color #3a3a3a

# Pane switching
map ctrl+shift+left  neighboring_window left
map ctrl+shift+right neighboring_window right
map ctrl+shift+up    neighboring_window up
map ctrl+shift+down  neighboring_window down

# Pane resizing (vim-style)
map ctrl+shift+h resize_window narrower
map ctrl+shift+l resize_window wider
map ctrl+shift+k resize_window taller
map ctrl+shift+j resize_window shorter


# Toggle split/stack layout
map ctrl+shift+t toggle_layout stack

# BEGIN_KITTY_FONTS
font_family      family="JetBrains Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS

# Sessions
map ctrl+;>k goto_session /home/nevillio/personal/last-algo/kata-machine/algo.kitty-session
map ctrl+;>r goto_session /home/nevillio/personal/frontend/react/react.kitty-session
map ctrl+;>/ goto_session
map ctrl+;>x close_session .
map ctrl+;>l goto_session -1
