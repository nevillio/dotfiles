# ===== Video Output & GPU Acceleration (Intel Arc Xe2) =====
vo=gpu-next
hwdec=vaapi
vd-lavc-dr=no

# ===== Video Quality & Scaling (Optimized for iGPU) =====
profile=gpu-hq
scale=ewa_lanczossharp
cscale=ewa_lanczossharp
dscale=bilinear
correct-downscaling
linear-downscaling
sigmoid-upscaling

# ===== Audio =====
ao=pipewire
volume-max=150

# ===== Subtitles - YouTube & External Files =====
sub-auto=fuzzy
sub-file-paths=srt:sub:subs:subtitles:embedded
sub-ass-override=force
sub-font-size=45
sub-color=1.0/1.0/1.0/1.0
sub-border-size=2
sub-border-color=0.0/0.0/0.0/1.0
sub-shadow-offset=1
sub-shadow-color=0.0/0.0/0.0/0.5
sub-margin-x=30
sub-margin-y=30

# ===== YouTube / yt-dlp Configuration =====
slang=en
ytdl-raw-options=format=bestvideo[height<=2160]+bestaudio/best[height<=2160]

# ===== Resume Playback =====
save-position-on-quit
watch-later-directory=~/.config/mpv/watch_later

# ===== Interface & Controls =====
osc=no
osd-bar=no
border=no
osd-duration=2000
osd-font-size=30
fullscreen=yes
keep-open=yes

# ===== Screenshot =====
screenshot-format=png
screenshot-png-compression=8
screenshot-directory=~/Pictures/mpv-screenshots

# ===== Network/Streaming =====
cache=yes
demuxer-max-bytes=150MiB
demuxer-max-back-bytes=75MiB

# ===== Performance =====
video-sync=display-resample
interpolation
tscale=oversample

# ===== Audio/Video File Paths =====
audio-file-auto=fuzzy
audio-file-paths=audio:sound:sounds

# ===== Colors (Catppuccin Mocha) =====
background-color='#1e1e2e'
osd-back-color='#11111b'
osd-border-color='#11111b'
osd-color='#cdd6f4'
osd-shadow-color='#1e1e2e'

# ===== UOSC Options =====
script-opts-append=uosc-color=foreground=b4befe,foreground_text=313244,background=1e1e2e,background_text=cdd6f4,curtain=181825,success=a6e3a1,error=f38ba8x90%
