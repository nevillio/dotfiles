# Video Output & GPU Acceleration
vo=gpu-next
hwdec=auto-safe

# Video Quality & Scaling
profile=gpu-hq
scale=ewa_lanczossharp
cscale=ewa_lanczossharp
dscale=mitchell
correct-downscaling
linear-downscaling
sigmoid-upscaling

# Audio
audio-device=auto
volume-max=150

# Subtitles - Auto-load and styling
sub-auto=fuzzy
sub-fix-timing=yes
sub-file-paths=ass:srt:sub:subs:subtitles
sub-font-size=45
sub-color=1.0/1.0/1.0/1.0
sub-border-size=2
sub-border-color=0.0/0.0/0.0/1.0
sub-shadow-offset=1
sub-shadow-color=0.0/0.0/0.0/0.5

# Resume playback from last position
save-position-on-quit
watch-later-directory=~/.config/mpv/watch_later

# Interface & Controls
osc=no
osd-bar=no
border=no
osd-duration=2000
osd-font-size=30

# Screenshot settings
screenshot-format=png
screenshot-png-compression=8
screenshot-directory=~/Pictures/mpv-screenshots

# Network/Streaming
cache=yes
demuxer-max-bytes=150MiB
demuxer-max-back-bytes=75MiB

# Performance
video-sync=display-resample
interpolation
tscale=oversample

# File associations
audio-file-auto=fuzzy
audio-file-paths=audio:sound:sounds

# Window behavior
fullscreen=yes
keep-open=yes

# Main mpv options
background-color='#1e1e2e'
osd-back-color='#11111b'
osd-border-color='#11111b'
osd-color='#cdd6f4'
osd-shadow-color='#1e1e2e'

# Stats script options
# Options are on separate lines for clarity
# Colors are in #BBGGRR format
script-opts-append=stats-border_color=251818
script-opts-append=stats-font_color=f4d6cd
script-opts-append=stats-plot_bg_border_color=febeb4
script-opts-append=stats-plot_bg_color=251818
script-opts-append=stats-plot_color=febeb4

# External script options
# It is fine to leave these here even if one does not use these scripts because they are just ignored unless a script uses them

# UOSC options
script-opts-append=uosc-color=foreground=b4befe,foreground_text=313244,background=1e1e2e,background_text=cdd6f4,curtain=181825,success=a6e3a1,error=f38ba8x90%
