# Playback Controls
j seek -5
l seek +5
k cycle pause
c cycle sub
f cycle fullscreen
q quit

# Speed Control
[ add speed -0.1
] add speed 0.1
* set speed 1.0

# Seeking
< playlist-prev
> playlist-next

# Subtitles
e cycle sub-ass-override
E cycle sub-scale

# Screenshots
s screenshot
S screenshot video
Alt+s screenshot window

# Video Adjustments
d frame-step
D frame-back-step
A cycle aspect
W cycle pan

# Thumbnails (requires thumbfast)
o script-binding thumbfast

# Audio
m cycle mute
SHIFT++ add volume 5
SHIFT+- add volume -5
